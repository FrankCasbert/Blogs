<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title | escape }} · {% endif %}{{ site.title | escape }}</title>
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <link rel="stylesheet" href="{{ '/styles/main.css' | relative_url }}">
</head>
<body>
  <a class="skip" href="#main">跳到正文</a>
  <header class="site-header wrap">
    <a class="brand" href="{{ '/' | relative_url }}">{{ site.title | escape }}<span class="brand-dot">.</span></a>
    <nav aria-label="主导航">
      <a href="{{ '/' | relative_url }}"{% if page.nav == 'home' %} aria-current="page"{% endif %}>首页</a>
      <a href="{{ '/archives/' | relative_url }}"{% if page.nav == 'archives' %} aria-current="page"{% endif %}>归档</a>
      <a href="{{ '/categories/' | relative_url }}"{% if page.nav == 'categories' %} aria-current="page"{% endif %}>分类</a>
      <a href="{{ '/posts/blog-guide.html' | relative_url }}">使用说明</a>
    </nav>
  </header>
  <main id="main" class="wrap">{{ content }}</main>
  <footer class="site-footer wrap">
    <span>© {{ 'now' | date: '%Y' }} {{ site.author | escape }} · 记录，积累，分享。</span>
    <a href="https://github.com/FrankCasbert/Blogs">GitHub ↗</a>
  </footer>
</body>
</html>
